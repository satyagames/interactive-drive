<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Pursuit Arena</title>
  </head>
  <body>
    <canvas id="app" tabindex="-1"></canvas>

    <!-- All visible copy is filled from content/ui.json at start-up (data-ui*). -->
    <div id="loader"><span data-ui="loader"></span></div>

    <!-- Covers respawn teleports; see src/ui/screenFade.js. -->
    <div id="fade" aria-hidden="true"></div>

    <div id="hud" aria-hidden="true">
      <span id="hud-speed">0</span><small data-ui="hud.speedUnit"></small>
      <span id="hud-fps" hidden></span>
    </div>

    <div id="progress" aria-live="polite">
      <span id="progress-count">0</span>&nbsp;/&nbsp;<span id="progress-total">4</span> <span data-ui="hud.found"></span>
    </div>

    <!-- Screen-reader announcements (Enter areas now; stamps and badges in Phase 6). -->
    <div id="announcer" class="sr-only" aria-live="polite"></div>

    <!-- Explore mode: every district and station as a list (src/content/explore.js). -->
    <button id="explore-open" type="button" aria-expanded="false" aria-controls="explore">
      <span data-ui="explore.open"></span> <kbd data-ui="explore.openHint"></kbd>
    </button>
    <div id="explore" hidden></div>

    <!-- Game layer (src/ui/gameHud.js, src/ui/passportScreen.js). -->
    <button id="passport-open" type="button" aria-expanded="false" aria-controls="passport">
      <span data-ui="passport.open"></span> <kbd data-ui="passport.openHint"></kbd>
    </button>
    <div id="passport" hidden></div>
    <div id="game-hud"></div>
    <div id="dash-hud" hidden></div>
    <div id="toasts" aria-live="polite" aria-atomic="false"></div>

    <!-- Station panel (src/content/panel.js): right-hand drawer, bottom sheet
         on narrow screens. Non-modal; driving keeps working while it's open. -->
    <aside id="station-panel" hidden></aside>

    <!-- Touch controls. Hidden by default; shown on coarse-pointer devices
         or when forced from the debug panel. The joystick points where you
         want to drive (src/input/touch.js). -->
    <div id="touch" hidden>
      <div class="touch-joystick" data-joystick role="group" data-ui-aria-label="touch.joystick">
        <div class="touch-joystick-knob"></div>
      </div>
      <div class="touch-cluster touch-right">
        <button class="touch-btn" data-action="boost" data-ui-aria-label="touch.boost">&#187;</button>
        <button class="touch-btn" data-action="brake" data-ui-aria-label="touch.brake">&#9632;</button>
        <button class="touch-btn" data-action="reverse" data-ui-aria-label="touch.reverse">&#9660;</button>
      </div>
      <button class="touch-btn touch-aux touch-interact" data-action="interact" data-ui-aria-label="touch.interact">&#8629;</button>
      <button class="touch-btn touch-aux touch-respawn" data-action="respawn" data-ui-aria-label="touch.respawn">&#10227;</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
